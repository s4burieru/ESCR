    <title>Pixel Car Animated</title>
    <style>
      :root {
        --bg: rgb(255, 230, 105);
        --k: #000;
        --r: #e00000;
        --d: #b00000;
        --l: #ff3232;
        --g: #1a1a1a;
        --s: #bebebe;
        --w: #fafafa;
        --p: #ff9696;
        --m: #777;
        --t: #222;
        --b: #111;
        --h: #555;
        --o: #c40000;
        --v: #787878;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        min-height: 100%;
      }
      .wrap {
        overflow: auto;
        display: flex;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 24px;
      }
      .stage {
        position: relative;
        width: 1240px;
        height: 410px;
        overflow: hidden;
        flex: none;
        margin: auto;
      }
      .stage table {
        border-collapse: collapse;
        table-layout: fixed;
        background: transparent;
      }
      .f {
        position: absolute;
        left: 100px;
        top: 0;
        width: 1040px;
      }
      .f table {
        width: 1040px;
      }
      .f col {
        width: 10px;
      }
      td {
        padding: 0;
        height: 10px;
        font-size: 0;
        line-height: 0;
      }
      .k {
        background: var(--k);
      }
      .r {
        background: var(--r);
      }
      .d {
        background: var(--d);
      }
      .l {
        background: var(--l);
      }
      .g {
        background: var(--g);
      }
      .s {
        background: var(--s);
      }
      .w {
        background: var(--w);
      }
      .p {
        background: var(--p);
      }
      .m {
        background: var(--m);
      }
      .t {
        background: var(--t);
      }
      .b {
        background: var(--b);
      }
      .h {
        background: var(--h);
      }
      .o {
        background: var(--o);
      }
      .v {
        background: var(--v);
      }
      .fa {
        animation: a 0.4s steps(1) infinite;
      }
      .fb {
        top: 10px;
        animation: b 0.4s steps(1) infinite;
      }
      @keyframes a {
        50% {
          visibility: hidden;
        }
      }
      @keyframes b {
        0% {
          visibility: hidden;
        }
        50% {
          visibility: visible;
        }
      }
      .rd {
        position: absolute;
        left: 0;
        top: 400px;
        width: 1600px;
        animation: m 0.6s steps(10) infinite;
      }
      .road {
        width: 1600px;
        table-layout: fixed;
      }
      .road td {
        width: 20px;
      }
      @keyframes m {
        to {
          transform: translateX(-400px);
        }
      }
      .stage i {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--w);
        animation: tw 1s steps(1) infinite;
      }
      @keyframes tw {
        50% {
          opacity: 0.15;
        }
      }
      .sp {
        position: absolute;
        height: 10px;
        background: var(--s);
        animation: z 0.3s steps(3) infinite;
        opacity: 0.6;
      }
      @keyframes z {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(110px);
        }
      }
    </style>
